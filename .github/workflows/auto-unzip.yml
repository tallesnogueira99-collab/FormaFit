name: Extrair automaticamente arquivos ZIP

on:
  push:
    branches:
      - main
    paths:
      - '**/*.zip'

permissions:
  contents: write

concurrency:
  group: automatic-zip-extraction
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extrair ZIPs adicionados ou modificados
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            git ls-tree -r --name-only "$CURRENT_SHA" > changed-files.txt
          else
            git diff --name-only --diff-filter=ACMR "$BEFORE_SHA" "$CURRENT_SHA" > changed-files.txt
          fi

          python3 - <<'PY'
          import os
          import pathlib
          import stat
          import zipfile

          repo = pathlib.Path.cwd().resolve()
          changed = pathlib.Path("changed-files.txt").read_text().splitlines()
          archives = sorted({
              (repo / name).resolve()
              for name in changed
              if pathlib.PurePosixPath(name).suffix.lower() == ".zip"
          })

          if not archives:
              print("Nenhum ZIP novo ou alterado neste envio.")
              raise SystemExit(0)

          max_entries = 2000
          max_total_size = 500 * 1024 * 1024
          max_file_size = 100 * 1024 * 1024

          for archive in archives:
              if repo not in archive.parents or not archive.is_file():
                  continue

              print(f"Processando: {archive.relative_to(repo)}")
              destination = archive.parent

              try:
                  with zipfile.ZipFile(archive) as zf:
                      infos = zf.infolist()
                      if len(infos) > max_entries:
                          raise ValueError("ZIP excede o limite de 2.000 entradas.")

                      total_size = sum(info.file_size for info in infos)
                      if total_size > max_total_size:
                          raise ValueError("ZIP excede o limite de 500 MB descompactados.")

                      seen = set()
                      for info in infos:
                          raw_name = info.filename
                          if not raw_name or "\\\\" in raw_name or "\x00" in raw_name:
                              raise ValueError(f"Caminho inválido: {raw_name!r}")

                          relative = pathlib.PurePosixPath(raw_name)
                          if relative.is_absolute() or any(part in ("", ".", "..") for part in relative.parts):
                              raise ValueError(f"Caminho inseguro: {raw_name}")

                          if relative.parts and ":" in relative.parts[0]:
                              raise ValueError(f"Caminho de unidade não permitido: {raw_name}")

                          normalized = relative.as_posix()
                          if normalized in seen:
                              raise ValueError(f"Entrada duplicada: {normalized}")
                          seen.add(normalized)

                          mode = info.external_attr >> 16
                          if stat.S_ISLNK(mode):
                              raise ValueError(f"Links simbólicos não são permitidos: {raw_name}")

                          if info.flag_bits & 0x1:
                              raise ValueError(f"Arquivo criptografado não suportado: {raw_name}")

                          if info.file_size > max_file_size:
                              raise ValueError(f"Arquivo excede 100 MB: {raw_name}")

                          target = (destination / pathlib.Path(*relative.parts)).resolve()
                          if target != destination and destination not in target.parents:
                              raise ValueError(f"Destino fora da pasta do ZIP: {raw_name}")

                      for info in infos:
                          relative = pathlib.PurePosixPath(info.filename)
                          target = destination.joinpath(*relative.parts)
                          if info.is_dir():
                              target.mkdir(parents=True, exist_ok=True)
                              continue
                          target.parent.mkdir(parents=True, exist_ok=True)
                          with zf.open(info, "r") as source, target.open("wb") as output:
                              while True:
                                  chunk = source.read(1024 * 1024)
                                  if not chunk:
                                      break
                                  output.write(chunk)

              except (zipfile.BadZipFile, RuntimeError, OSError, ValueError) as exc:
                  raise SystemExit(f"Falha ao extrair {archive.name}: {exc}")

          print("Extração concluída.")
          PY

      - name: Salvar arquivos extraídos no repositório
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Nenhum arquivo novo ou alterado para registrar."
            exit 0
          fi
          git commit -m "Descompacta automaticamente arquivos ZIP [skip ci]"
          git push
