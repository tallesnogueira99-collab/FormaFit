name: Modularize FORMA safely

on:
  push:
    branches:
      - refactor/forma-modularizacao-main-2026-11-28

permissions:
  contents: write

jobs:
  modularize:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: refactor/forma-modularizacao-main-2026-11-28
          persist-credentials: true
      - name: Extract inline assets
        run: python3 scripts/modularize_forma.py
      - name: Validate JavaScript and references
        shell: bash
        run: |
          set -euo pipefail
          for file in js/*.js sw.js; do node --check "$file"; done
          python3 - <<'PY'
          import pathlib, re
          html = pathlib.Path("index.html").read_text()
          scripts = re.findall(r'<script\\b[^>]*src="([^"]+)"[^>]*></script>', html, re.I)
          styles = re.findall(r'<link\\b[^>]*rel="stylesheet"[^>]*href="([^"]+)"', html, re.I)
          assert len([x for x in scripts if x.startswith("./js/")]) == 16
          assert len([x for x in styles if x.startswith("./styles/")]) == 16
          for path in scripts + styles:
              if path.startswith("./"):
                  assert pathlib.Path(path[2:]).is_file(), path
          assert "vercel.live/_next-live/feedback/feedback.js" not in html
          print("Validated 16 JS and 16 CSS assets")
          PY
          git diff --check
      - name: Commit generated assets and remove temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/modularize_forma.py .github/workflows/forma-modularize.yml
          git add index.html sw.js MODULARIZACAO.md js styles
          git commit -m "Modulariza index.html sobre a versão atual [skip ci]"
          git push origin HEAD:refactor/forma-modularizacao-main-2026-11-28
