name: Build and validate FORMA v119

on:
  push:
    branches:
      - forma/v119-nutricao-reestruturada
    paths:
      - "index.html"
      - "sw.js"
      - "manifest.webmanifest"
      - "icon.svg"
      - "icon-192.png"
      - "icon-512.png"
      - ".github/workflows/build-forma-v119.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Gerar pacote completo
        run: |
          rm -f FORMA_v119_ajustes_navegacao_energia.zip
          zip -j FORMA_v119_ajustes_navegacao_energia.zip index.html manifest.webmanifest sw.js icon.svg icon-192.png icon-512.png
      - name: Validar estrutura, integridade e scripts
        shell: bash
        run: |
          set -euo pipefail
          unzip -t FORMA_v119_ajustes_navegacao_energia.zip
          rm -rf /tmp/forma-v119
          mkdir -p /tmp/forma-v119
          unzip -q FORMA_v119_ajustes_navegacao_energia.zip -d /tmp/forma-v119
          python3 - <<'PY'
          from pathlib import Path
          import json, re, zipfile, subprocess
          root = Path("/tmp/forma-v119")
          required = {"index.html", "manifest.webmanifest", "sw.js", "icon.svg", "icon-192.png", "icon-512.png"}
          assert {p.name for p in root.iterdir()} == required, "Estrutura do pacote diferente da esperada"
          manifest = json.loads((root / "manifest.webmanifest").read_text(encoding="utf-8"))
          for icon in manifest.get("icons", []):
              assert (root / icon["src"]).is_file(), f"Ícone ausente: {icon['src']}"
          for name in ("icon-192.png", "icon-512.png"):
              assert (root / name).read_bytes().startswith(b"\x89PNG\r\n\x1a\n"), f"PNG inválido: {name}"
          sw = (root / "sw.js").read_text(encoding="utf-8")
          assert "forma-pwa-v119" in sw, "Cache v119 não encontrado"
          html = (root / "index.html").read_text(encoding="utf-8")
          for marker in ('id="nutritionOverview"', 'id="nutritionPlanningIntro"', 'nutritionPlanning:"nutricao"', 'nutritionLibrary:"nutricao"', "function renderNutritionOverview()"):
              assert marker in html, f"Marcador ausente: {marker}"
          assert "__formaV117AreaNavigation" not in html, "Guard de navegação antigo permaneceu"
          ids = re.findall(r'\bid="([^"]+)"', html)
          for ident in ("nutritionOverview", "nutritionOverviewDate", "nutritionOverviewKcal", "nutritionOverviewMacros", "nutritionPlanningIntro", "foodGoalsBtn"):
              assert ids.count(ident) == 1, f"ID ausente ou duplicado: {ident} ({ids.count(ident)})"
          scripts = re.findall(r'<script[^>]*>(.*?)</script\s*>', html, flags=re.I | re.S)
          checked = 0
          for index, body in enumerate(scripts):
              if not body.strip():
                  continue
              path = Path(f"/tmp/forma-v119-inline-{index}.js")
              path.write_text(body, encoding="utf-8")
              subprocess.run(["node", "--check", str(path)], check=True)
              checked += 1
          assert checked >= 5, f"Poucos scripts verificados: {checked}"
          with zipfile.ZipFile("FORMA_v119_ajustes_navegacao_energia.zip") as archive:
              assert archive.testzip() is None, "CRC do ZIP inválido"
          print(f"v119 validada: {len(required)} arquivos, {checked} scripts JavaScript, manifesto e ícones íntegros.")
          PY
      - name: Commit do pacote validado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add FORMA_v119_ajustes_navegacao_energia.zip
          if git diff --cached --quiet; then
            echo "Pacote já atualizado."
          else
            git commit -m "Build pacote completo FORMA v119"
            git push
          fi
